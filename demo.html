<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FunS Connect — demo</title>
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        background: #070a12;
        color: #fff;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        text-align: center;
        max-width: 420px;
        padding: 24px;
      }
      #out {
        margin-top: 20px;
        font-size: 13px;
        color: #9aa4b2;
        word-break: break-all;
      }
      input {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #222;
        background: #0f1422;
        color: #fff;
        margin-bottom: 16px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>FunS Connect</h1>
      <p>Enter a WalletConnect projectId (or leave blank to use the demo id).</p>
      <input id="pid" placeholder="WalletConnect projectId (optional)" />
      <button id="btn" type="button" style="padding:10px 18px;border:none;border-radius:12px;background:#FF6B35;color:#fff;font-weight:600;cursor:pointer">
        Connect FunS Wallet
      </button>
      <div id="out"></div>
    </div>

    <!-- Local build. Run `npm run build` first. -->
    <script src="./dist/funs-connect.global.js"></script>
    <script>
      const out = document.getElementById('out');
      document.getElementById('btn').addEventListener('click', async () => {
        out.textContent = 'Connecting…';
        try {
          const projectId =
            document.getElementById('pid').value.trim() || undefined;
          const provider = await FunsConnect.connectFunsWallet({ projectId });
          const accounts = await provider.request({
            method: 'eth_requestAccounts',
          });
          out.textContent = '✅ Connected: ' + (accounts[0] || '(none)');
          provider.on('disconnect', () => {
            out.textContent = 'Disconnected.';
          });
        } catch (e) {
          out.textContent = '❌ ' + (e && e.message ? e.message : String(e));
        }
      });
    </script>
  </body>
</html>
